stages:
  - lint
  - test
  - packages

variables:
  APKG_VERSION: "10.0.57"

verify-ci-package-needs:
  stage: lint
  script:
    - python3 lib/verify-ci-package-needs.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint-all:
  stage: lint
  before_script:
    - dotnet tool update -g aiursoft.apkg.client --version "$APKG_VERSION" --configfile ./nuget.config || dotnet tool install -g aiursoft.apkg.client --version "$APKG_VERSION" --configfile ./nuget.config
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - apkg --version
  script:
    - |
      failed=0
      for dir in */; do
        if ls "$dir"*.aosproj >/dev/null 2>&1; then
          (cd "$dir" && apkg lint) || failed=1
        fi
      done
      exit "$failed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test-all:
  stage: test
  needs:
    - lint-all
    - verify-ci-package-needs
  timeout: 3h
  before_script:
    - dotnet tool update -g aiursoft.apkg.client --version "$APKG_VERSION" --configfile ./nuget.config || dotnet tool install -g aiursoft.apkg.client --version "$APKG_VERSION" --configfile ./nuget.config
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - apkg --version
    - |
      set -euo pipefail
      sudo -n apt-get update
      sudo -n apt-get install -y --no-install-recommends \
        build-essential pkg-config cargo rustc libgtk-4-dev libadwaita-1-dev \
        libpcap-dev gettext git jq nodejs gjs bubblewrap dbus-daemon dconf-cli \
        python3 python3-gi python3-cairo python3-gi-cairo python3-apt python3-unidecode \
        gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-nm-1.0 gir1.2-gstreamer-1.0 \
        gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
        gstreamer1.0-plugins-bad gsettings-desktop-schemas netplan.io unattended-upgrades \
        fontconfig pango1.0-tools
  script:
    - apkg test --path . --recursive --profile anduinos-package-release-test --report test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.publish:
  stage: packages
  timeout: 3h
  before_script:
    - dotnet tool update -g aiursoft.apkg.client --version "$APKG_VERSION" --configfile ./nuget.config || dotnet tool install -g aiursoft.apkg.client --version "$APKG_VERSION" --configfile ./nuget.config
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - apkg --version
  script:
    - cd "$PACKAGE_DIR"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] ||
         { [ "$CI_COMMIT_BRANCH" != "master" ] && [ "$CI_COMMIT_BRANCH" != "prod" ]; }; then
        apkg build --all
        exit 0
      fi
      if [ "$CI_COMMIT_BRANCH" = "prod" ]; then
        APKG_SOURCE="https://apkg.aiursoft.com"
        APKG_KEY="$APKG_PROD_API_KEY"
      else
        APKG_SOURCE="https://apkg-dev.aiursoft.com"
        APKG_KEY="$APKG_DEV_API_KEY"
      fi
      apkg deploy --all \
        --source "$APKG_SOURCE" \
        --api-key "$APKG_KEY" \
        --skip-existing
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

