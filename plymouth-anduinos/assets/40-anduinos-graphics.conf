# Keep native display drivers available before Plymouth starts in the initrd.
# UseSimpledrm=1 only makes Dracut's Plymouth module depend on simpledrm;
# ARM64 virtio graphics has no firmware framebuffer for simpledrm to use.
# A generic installer image (--no-hostonly) also skips the host-only virtio
# detection in systemd-ask-password. Loading the GPU after switch-root can
# expose a Plymouth connector-readiness race and leave the splash invisible.
# Use Dracut's existing DRM driver selection for both generic installation
# images and host-only kernel updates; do not depend on a later migration
# service rebuilding the image, or change Plymouth's renderer policy.
add_dracutmodules+=" drm "
