# Keep virtio graphics available to Plymouth in the initrd.
# UseSimpledrm=1 only makes Dracut's Plymouth module depend on simpledrm;
# ARM64 virtio graphics has no firmware framebuffer for simpledrm to use.
# A generic installer image (--no-hostonly) also skips the host-only virtio
# detection in systemd-ask-password. Loading the GPU after switch-root can
# expose a Plymouth connector-readiness race and leave the splash invisible.
# Include the driver and its dependencies in both generic installation images
# and host-only kernel updates. Adding the entire DRM module group would also
# copy unrelated GPU firmware into generic images (about 150 MiB in testing).
# Do not depend on a later migration rebuild or change the renderer policy.
add_drivers+=" virtio_gpu "
