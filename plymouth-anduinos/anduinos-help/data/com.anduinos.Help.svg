<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- AnduinOS Help icon: a stylised open book in AnduinOS blue.
       Designed to be visually consistent with other com.anduinos.* icons:
       rounded square body, single accent colour, no shadow or gradient. -->
  <defs>
    <linearGradient id="anduinos-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8dd8"/>
      <stop offset="100%" stop-color="#2268ab"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#anduinos-blue)"/>
  <!-- Open book pages -->
  <path d="M 16 18 L 16 48 C 22 46 28 46 32 49 C 36 46 42 46 48 48 L 48 18 C 42 16 36 16 32 19 C 28 16 22 16 16 18 Z"
        fill="#ffffff" fill-opacity="0.95"/>
  <line x1="32" y1="19" x2="32" y2="49" stroke="#2268ab" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Text lines on the left page -->
  <line x1="20" y1="26" x2="29" y2="26" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="29" y2="31" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="20" y1="36" x2="27" y2="36" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="20" y1="41" x2="29" y2="41" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- Text lines on the right page -->
  <line x1="35" y1="26" x2="44" y2="26" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="35" y1="31" x2="44" y2="31" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="35" y1="36" x2="42" y2="36" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="35" y1="41" x2="44" y2="41" stroke="#2268ab" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
</svg>
