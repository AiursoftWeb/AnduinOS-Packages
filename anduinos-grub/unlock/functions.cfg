# The EFI stub supplies verified volume identities and an optional keyboard ID.
# Password input stays inside cryptomount.
function anduinos_unlock {
    set anduinos_unlock_volume=$1
    set anduinos_unlock_filesystem=$2
    set anduinos_unlock_directory=$3
    set anduinos_unlock_recovery=$4
    if [ "$anduinos_unlock_recovery" = "-" ]; then
        unset anduinos_unlock_recovery
    fi
    set anduinos_unlock_keyboard=$5
    unset anduinos_keyboard_name
    source (memdisk)/anduinos-unlock/keyboards.cfg
    anduinos_keyboard_description
    export anduinos_unlock_volume
    export anduinos_unlock_filesystem
    export anduinos_unlock_directory
    export anduinos_unlock_recovery
    export anduinos_unlock_keyboard
    export anduinos_keyboard_name

    # Fonts and artwork are part of this EFI image, available before opening
    # /boot. Serial terminals remain active; EFI text output must not paint
    # over the graphical framebuffer. Failed graphics retain a usable prompt.
    if [ -z "$gfxmode" ]; then
        set gfxmode=1280x800,1024x768,800x600,auto
    fi
    set gfxterm_font="DejaVu Sans Mono Regular 14"
    if anduinos_unlock_graphics; then
        terminal_output --remove console
        background_color "#101b2b"
        set color_normal=white/black
        set theme=(memdisk)/anduinos-unlock/theme.txt
        export theme
        normal (memdisk)/anduinos-unlock/menu.cfg
    fi

    terminal_output --append console
    if [ -n "$anduinos_keyboard_name" ]; then
        normal (memdisk)/anduinos-unlock/menu.cfg
    fi
    anduinos_unlock_firmware_keyboard
}

function anduinos_unlock_firmware_keyboard {
    set anduinos_keyboard_name="Firmware default (usually US)"
    anduinos_unlock_root
}

function anduinos_unlock_selected_keyboard {
    if keymap "(memdisk)/anduinos-unlock/$anduinos_unlock_keyboard.gkb"; then
        if terminal_input at_keyboard; then
            clear
            echo "Press Esc to use the $anduinos_keyboard_name keyboard."
            echo 'If Esc does not respond, the firmware keyboard will be used.'
            echo
            if ! sleep --interruptible --verbose 8; then
                set anduinos_native_keyboard=1
                anduinos_unlock_root
                return
            fi
        fi
    fi
    terminal_input console
    anduinos_unlock_firmware_keyboard
}

function anduinos_unlock_graphics {
    # GRUB scripts use nested conditions rather than shell && expressions.
    if loadfont (memdisk)/anduinos-unlock/title.pf2; then
        if loadfont (memdisk)/anduinos-unlock/body.pf2; then
            if loadfont (memdisk)/anduinos-unlock/terminal.pf2; then
                if terminal_output --append gfxterm; then
                    return 0
                fi
            fi
        fi
    fi
    return 1
}

function anduinos_unlock_root {
    clear
    echo 'Disk password or emergency recovery key'
    echo "Keyboard layout: $anduinos_keyboard_name"
    echo 'Characters are hidden. Press Enter to unlock.'
    echo
    set cryptodisk_passphrase_tries=1
    while ! cryptomount -u $anduinos_unlock_volume; do
        clear
        set color_normal=light-red/black
        echo 'Could not unlock the disk. Check your password and try again.'
        set color_normal=white/black
        echo "Keyboard layout: $anduinos_keyboard_name"
        echo 'You can also enter your emergency recovery key.'
        echo
    done
    if [ "$anduinos_native_keyboard" = "1" ]; then
        terminal_input console
        unset anduinos_native_keyboard
    fi

    # Load the existing installed menu directly. Returning from an automatic
    # unlock menu entry would make GRUB report a spurious boot failure.
    unset theme
    unset gfxterm_font
    search.fs_uuid $anduinos_unlock_filesystem root cryptouuid/$anduinos_unlock_volume
    set prefix=($root)$anduinos_unlock_directory
    if [ -f $prefix/grub.cfg ]; then
        # gfxterm reads gfxmode only when initialized. Release the temporary
        # unlock display so the installed menu can apply its own resolution,
        # font and theme. Keep serial output and a console during the handoff.
        terminal_output --append console
        terminal_output --remove gfxterm
        unset gfxmode
        configfile $prefix/grub.cfg
    fi

    # The installation binds its public RE by UUID. This menu and its boot
    # files live outside root; a missing installed grub.cfg must not strand
    # the user at GRUB's command line. Older three-argument stubs are unchanged.
    if [ -n "$anduinos_unlock_recovery" ]; then
        if search --no-floppy --fs-uuid --set=recovery $anduinos_unlock_recovery; then
            if [ -f ($recovery)/anduinos-recovery-env/grub.cfg ]; then
                set theme=(memdisk)/anduinos-unlock/recovery-theme.txt
                export theme
                configfile ($recovery)/anduinos-recovery-env/grub.cfg
            fi
        fi
    fi
}
