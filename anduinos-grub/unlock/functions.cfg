# The EFI stub supplies only the already verified outer UUID, inner UUID and
# root-relative GRUB directory. Password input stays inside cryptomount.
function anduinos_unlock {
    set anduinos_unlock_volume=$1
    set anduinos_unlock_filesystem=$2
    set anduinos_unlock_directory=$3
    export anduinos_unlock_volume
    export anduinos_unlock_filesystem
    export anduinos_unlock_directory

    # Fonts and artwork are part of this EFI image, available before opening
    # /boot. Serial terminals remain active; EFI text output must not paint
    # over the graphical framebuffer. Failed graphics retain a usable prompt.
    if [ -z "$gfxmode" ]; then
        set gfxmode=1280x800,1024x768,800x600,auto
    fi
    set gfxterm_font="DejaVu Sans Mono Regular 14"
    if anduinos_unlock_graphics; then
        terminal_output --remove console
        background_color "#101b2b"
        set color_normal=white/black
        set theme=(memdisk)/anduinos-unlock/theme.txt
        export theme
        normal (memdisk)/anduinos-unlock/menu.cfg
    fi

    terminal_output --append console
    anduinos_unlock_root
}

function anduinos_unlock_graphics {
    # GRUB scripts use nested conditions rather than shell && expressions.
    if loadfont (memdisk)/anduinos-unlock/title.pf2; then
        if loadfont (memdisk)/anduinos-unlock/body.pf2; then
            if loadfont (memdisk)/anduinos-unlock/terminal.pf2; then
                if terminal_output --append gfxterm; then
                    return 0
                fi
            fi
        fi
    fi
    return 1
}

function anduinos_unlock_root {
    clear
    echo 'Disk password or recovery key'
    echo 'US keyboard. Characters are hidden. Press Enter to unlock.'
    echo
    set cryptodisk_passphrase_tries=1
    while ! cryptomount -u $anduinos_unlock_volume; do
        clear
        set color_normal=light-red/black
        echo 'Could not unlock the disk. Check your password and try again.'
        set color_normal=white/black
        echo 'US keyboard. You can also enter your recovery key.'
        echo
    done

    # Load the existing installed menu directly. Returning from an automatic
    # unlock menu entry would make GRUB report a spurious boot failure.
    unset theme
    unset gfxterm_font
    search.fs_uuid $anduinos_unlock_filesystem root cryptouuid/$anduinos_unlock_volume
    set prefix=($root)$anduinos_unlock_directory
    configfile $prefix/grub.cfg
}
