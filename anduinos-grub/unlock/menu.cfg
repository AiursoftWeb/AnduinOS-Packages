# One short automatic entry initializes GRUB's responsive theme and terminal
# geometry. Typing the password needs no preliminary Enter key.
set timeout=1
set timeout_style=menu
set default=0
if [ -n "$anduinos_keyboard_name" ]; then
    set timeout=5
    menuentry "Unlock disk - $anduinos_keyboard_name" {
        anduinos_unlock_selected_keyboard
    }
    menuentry 'Unlock disk - firmware keyboard' {
        anduinos_unlock_firmware_keyboard
    }
else
    menuentry 'Unlock disk' {
        anduinos_unlock_firmware_keyboard
    }
fi
