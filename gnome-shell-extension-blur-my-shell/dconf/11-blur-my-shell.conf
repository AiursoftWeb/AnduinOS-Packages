[org/gnome/shell/extensions/blur-my-shell]
hacks-level=0
# The lock screen keeps light text in both GNOME Shell color schemes. Give it
# a dedicated dimmed pipeline so that light wallpapers remain legible, while
# leaving the overview, panel, and screenshot appearance unchanged.
pipelines={'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_000000000000'>, 'params': <{'radius': <45>, 'brightness': <1>, 'unscaled_radius': <20>}>}>]>}, 'pipeline_lockscreen': {'name': <'Lock Screen'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_000000000001'>, 'params': <{'radius': <45>, 'brightness': <0.45>, 'unscaled_radius': <20>}>}>]>}}
settings-version=2

[org/gnome/shell/extensions/blur-my-shell/appfolder]
blur=false


[org/gnome/shell/extensions/blur-my-shell/lockscreen]
pipeline='pipeline_lockscreen'

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true
pipeline='pipeline_default'
style-components=1

[org/gnome/shell/extensions/blur-my-shell/panel]
brightness=0.80000000000000004
force-light-text=false
override-background=true
override-background-dynamically=true
pipeline='pipeline_default'
sigma=20
static-blur=true
unblur-in-overview=false

[org/gnome/shell/extensions/blur-my-shell/screenshot]
pipeline='pipeline_default'
