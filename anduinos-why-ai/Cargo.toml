[package]
name = "why"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "why — a fully offline, zero-daemon LLM CLI for AnduinOS, backed by a bundled Gemma 4 E2B model over llama.cpp"
authors = ["AnduinOS Team <anduin@aiursoft.com>"]

[[bin]]
name = "why"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = { version = "0.1", features = ["vulkan"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
encoding_rs = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
