# Default schedules are deliberately disabled. Users must explicitly enable
# automatic recovery after the AnduinOS storage layout has passed validation.

[[schedule]]
enabled = false
scope = "system"
notify_on_create = true
type = "hourly"
prefix = "hourly"
description = "Hourly system recovery point"
keep_count = 24
keep_days = 1

[[schedule]]
enabled = false
scope = "system"
notify_on_create = true
type = "daily"
time = "02:00"
prefix = "daily"
description = "Daily system recovery point"
keep_count = 7
keep_days = 7

[[schedule]]
enabled = false
scope = "system"
notify_on_create = true
type = "weekly"
time = "03:00"
day_of_week = 0
prefix = "weekly"
description = "Weekly system recovery point"
keep_count = 4
keep_days = 35

[[schedule]]
enabled = false
scope = "system"
notify_on_create = true
type = "monthly"
time = "04:00"
day_of_month = 1
prefix = "monthly"
description = "Monthly system recovery point"
keep_count = 12
keep_days = 365

[[schedule]]
enabled = false
scope = "personal"
notify_on_create = true
type = "hourly"
prefix = "personal-hourly"
description = "Hourly Personal Files history"
keep_count = 24
keep_days = 1

[schedule.timeline_retention]
hourly_limit = 24
daily_limit = 7
weekly_limit = 4
monthly_limit = 6
yearly_limit = 0
