[package]
name = "anduinos-waypoint-helper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Privileged helper for AnduinOS Waypoint recovery operations"

[[bin]]
name = "anduinos-waypoint-helper"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
toml.workspace = true
env_logger = "0.11"

# D-Bus service and Polkit authorization
zbus = { version = "4.0", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# System utilities
libc = "0.2"
nix = { version = "0.29", features = ["fs"] }
flate2 = "1.1"

# Shared types
waypoint-common = { path = "../waypoint-common" }
anduinos-recovery-engine = { path = "../anduinos-recovery-engine" }
