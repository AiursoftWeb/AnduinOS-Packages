# AnduinOS Swap — optimized swappiness for in-memory compressed swap (zram)
# With zram (LZ4-compressed RAM swap), preferring swap over dropping file cache
# is the right trade-off: decompression is nanoseconds, disk reads are milliseconds.
# page-cluster=0 disables swap readahead — pointless for random-access RAM.
vm.swappiness = 100
vm.page-cluster = 0
