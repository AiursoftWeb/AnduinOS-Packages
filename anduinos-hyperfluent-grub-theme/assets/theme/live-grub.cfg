# The Live ISO carries this directory outside SquashFS. Keep the stock menu
# when the font, artwork, or a graphics module is unavailable. The caller
# first tries signed GRUB's trusted Unicode font, then the BIOS font fallback.
if [ "$theme_font_ready" = "1" ]; then
    if [ -f /boot/grub/themes/anduinos-hyperfluent/theme.txt ]; then
        if [ -f /boot/grub/themes/anduinos-hyperfluent/background.png ]; then
            if insmod gfxmenu; then
                if insmod png; then
                    set theme=($root)/boot/grub/themes/anduinos-hyperfluent/theme.txt
                    export theme
                fi
            fi
        fi
    fi
fi
