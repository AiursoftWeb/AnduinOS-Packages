[package]
name = "anduinos-timeback-machine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Btrfs system recovery and deployment manager for AnduinOS"
authors = ["AnduinOS Team <anduin@aiursoft.com>"]

[lib]
name = "anduinos_timeback"
path = "src/lib.rs"

[[bin]]
name = "anduinos-timeback-machine"
path = "src/main.rs"

[[bin]]
name = "timebackctl"
path = "src/timebackctl.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
