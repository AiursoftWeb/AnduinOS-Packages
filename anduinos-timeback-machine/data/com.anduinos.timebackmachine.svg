<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- AnduinOS blue clock body -->
  <circle cx="32" cy="32" r="29" fill="#357cf4"/>

  <!-- Soft glass highlight, matching the other AnduinOS application icons -->
  <circle cx="32" cy="32" r="24" fill="#fff" opacity=".15"/>
  <path d="M10.6 24.2A23.5 23.5 0 0 1 51.9 19"
        fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".18"/>

  <!-- Counter-clockwise recovery arrow -->
  <path d="M19.5 20A18 18 0 1 1 14.5 32"
        fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".88"/>
  <path d="M19.5 11.5V20H28"
        fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"
        stroke-linejoin="round" opacity=".88"/>

  <!-- Clock hands -->
  <path d="M32 20.5V32l8.5 5"
        fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="2.5" fill="#fff"/>
