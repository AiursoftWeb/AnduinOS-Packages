[workspace]
members = [
    "anduinos-recovery-engine",
    "btrfs-snapshots-manager",
    "btrfs-snapshots-manager-helper",
    "snapshots-manager-common",
    "btrfs-snapshots-manager-scheduler",
    "btrfs-snapshots-manager-notifier",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
    "AnduinOS Team <anduin@aiursoft.com>",
]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Shared dependencies
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
once_cell = "1.21"
fs2 = "0.4"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 16
strip = true
