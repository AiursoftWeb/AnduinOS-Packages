[package]
name = "anduinos-btrfs-snapshots-manager-helper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Privileged helper for Disk Snapshots Manager recovery operations"

[[bin]]
name = "anduinos-btrfs-snapshots-manager-helper"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
toml.workspace = true
env_logger = "0.11"

# D-Bus service and Polkit authorization
zbus = { version = "4.0", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

# System utilities
libc = "0.2"
nix = { version = "0.29", features = ["fs", "user"] }
flate2 = "1.1"
uuid = { version = "1", features = ["v4"] }

# Shared types
snapshots-manager-common = { path = "../snapshots-manager-common" }
anduinos-recovery-engine = { path = "../anduinos-recovery-engine" }
