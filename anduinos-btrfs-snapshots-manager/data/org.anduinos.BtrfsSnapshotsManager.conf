<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.anduinos.BtrfsSnapshotsManager"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.anduinos.BtrfsSnapshotsManager"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="GetRecoveryEngineStatus"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="CreatePersonalSnapshot"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="VerifyPersonalSnapshot"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="ListPersonalFiles"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="ExportPersonalFile"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="DeletePersonalSnapshot"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="DeletePersonalSnapshots"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="SetPersonalSnapshotPinned"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="RenamePersonalSnapshot"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="GetAutomationConfig"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="SaveAutomationConfig"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="RestartScheduler"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="GetBtrfsFilesystemStatus"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="GetSmartDiskHealth"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.anduinos.BtrfsSnapshotsManager.Helper"
           send_member="RunBtrfsMaintenanceAction"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.anduinos.BtrfsSnapshotsManager"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
