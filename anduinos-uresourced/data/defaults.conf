# AnduinOS desktop resource defaults. Override individual keys in
# /etc/uresourced.conf.d/; do not edit this package-owned file.
[AnduinOS]
Enabled=true

[Global]
MaxMemoryMin=10%

[ActiveUser]
MemoryMin=250M
CPUWeight=500
IOWeight=500

# SessionSlice inherits ActiveUser unless explicitly configured.

[AppBoost]
DefaultCPUWeight=100
DefaultIOWeight=100
ActiveCPUWeight=300
ActiveIOWeight=300
BoostCPUWeightInc=200
BoostIOWeightInc=200
