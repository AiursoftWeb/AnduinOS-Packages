# Default GNOME application folders for users without a user-level override.
#
# Existing user values take precedence and are never rewritten on upgrade.

[org/gnome/desktop/app-folders]
folder-children=['System', 'Utilities', 'YaST', 'Pardus']

[org/gnome/desktop/app-folders/folders/System]
name='X-GNOME-Shell-System.directory'
translate=true
apps=['nm-connection-editor.desktop', 'com.anduinos.DriverCenter.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.baobab.desktop', 'org.anduinos.BtrfsSnapshotsManager.desktop', 'org.gnome.Logs.desktop', 'com.anduinos.ufwall.desktop', 'com.anduinos.swapcontrol.desktop', 'com.anduinos.yubikeymanager.desktop']

[org/gnome/desktop/app-folders/folders/Utilities]
name='X-GNOME-Shell-Utilities.directory'
translate=true
apps=['org.gnome.Papers.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.font-viewer.desktop', 'org.gnome.Loupe.desktop', 'org.gnome.seahorse.Application.desktop']

[org/gnome/desktop/app-folders/folders/YaST]
name='suse-yast.directory'
translate=true
categories=['X-SuSE-YaST']

[org/gnome/desktop/app-folders/folders/Pardus]
name='X-Pardus-Apps.directory'
translate=true
categories=['X-Pardus-Apps']
